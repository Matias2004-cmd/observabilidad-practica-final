apiVersion: 1

groups:
  - orgId: 1
    name: infraestructura-cpu
    folder: SRE
    interval: 30s
    rules:
      - uid: cpu-alta
        title: CPU alta en el host
        condition: C
        data:
          # A: consulta PromQL del uso de CPU (%)
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)
              instant: true
              intervalMs: 15000
              maxDataPoints: 43200
          # B: reduce la serie a un único valor (el último)
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          # C: umbral -> dispara si la CPU supera el 80 %
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        # Debe sostenerse 1 minuto: evita alertar por picos momentáneos (flapping)
        for: 1m
        # Sin datos (p. ej. al arrancar el stack) no es un incidente de CPU: evita falsos avisos
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Uso de CPU sobre 80% en {{ $labels.instance }}"
          description: "La CPU del host lleva más de 1 minuto sobre el 80% (valor actual: {{ printf \"%.1f\" $values.B.Value }}%)."
          runbook_url: "https://runbooks.empresa.local/cpu-alta"
        isPaused: false
